<!doctype html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../frontend/src/styles.css"><style>body{height:100vh;overflow:hidden}.fake-bg{position:fixed;inset:0;background:radial-gradient(circle at 75% -10%,#162536 0,transparent 32%),#0a0e13}.fake-card{position:absolute;left:330px;right:50px;top:100px;height:150px;border:1px solid #263242;border-radius:16px;background:#111821;opacity:.65}.exercise-thumb svg{width:48px;height:48px;stroke:#b6c2d0;fill:none;stroke-width:2}.modal{width:min(760px,100%)}.exercise-result{grid-template-columns:72px 1fr}.exercise-thumb{width:66px;height:66px}@page{size:1440px 1000px;margin:0} html,body{width:1440px;height:1000px}
